name: Policy Manifest

on:
  push:
    paths:
      - 'schemas/**'
      - 'tools/*manifest*'
  pull_request:
    paths:
      - 'schemas/**'
      - 'tools/*manifest*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate example manifest
        run: node tools/validate-manifest.js tools/policy-manifest.example.json
